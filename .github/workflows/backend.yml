name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - app.py
      - reviewer_app.py
      - src/**
      - scripts/**
      - tests/**
      - data/**
      - requirements*.txt
      - pyproject.toml
      - .env.example
      - .gitattributes
      - .github/workflows/**
  pull_request:
    branches: [main]
    paths:
      - app.py
      - reviewer_app.py
      - src/**
      - scripts/**
      - tests/**
      - data/**
      - requirements*.txt
      - pyproject.toml
      - .env.example
      - .gitattributes
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      ADZUNA_APP_ID: ""
      ADZUNA_APP_KEY: ""
      ECE_DEVELOPMENT_MODE: "false"
      ECE_REFRESH_SOURCES: "false"
      ECE_CACHE_DIR: .cache/ci-runtime
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run backend and Streamlit tests
        run: python -m pytest -q --junitxml=output/ci/tests.xml
      - name: Check production startup and offline preview
        if: ${{ !cancelled() }}
        run: python scripts/check_deployment.py --smoke --output output/ci/deployment.json
      - name: Save test and readiness reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ matrix.os }}-py312
          path: |
            output/ci/tests.xml
            output/ci/deployment.json
          if-no-files-found: warn
          retention-days: 14
  browser:
    name: Chromium / real Streamlit sessions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-browser.txt
      - name: Install optional browser dependencies
        run: python -m pip install -r requirements-browser.txt
      - name: Install Chromium headless shell
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Check real browser profiles and WebSocket sessions
        run: python scripts/check_browser.py --output output/ci/browser.json
      - name: Check local human-review workspace
        run: python scripts/check_browser.py --reviewer --output output/ci/reviewer-browser.json
      - name: Check progressive UI with controlled slow AI
        run: python scripts/check_progressive_browser.py --output output/ci/progressive-browser.json
      - name: Save browser acceptance report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-chromium-py312
          path: |
            output/ci/browser.json
            output/ci/browser_failure.png
            output/ci/reviewer-browser.json
            output/ci/progressive-browser.json
          if-no-files-found: warn
          retention-days: 14
